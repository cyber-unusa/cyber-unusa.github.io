# Nama workflow, akan tampil di tab "Actions" pada repositori GitHub Anda
name: Build and Deploy to GitHub Pages

# Kapan workflow ini harus dijalankan?
on:
  # Setiap kali ada 'push' (upload kode)
  push:
    # Hanya jika push dilakukan ke branch 'main'
    branches:
      - main 

# Daftar pekerjaan (jobs) yang harus dilakukan
jobs:
  # Nama pekerjaan, bisa apa saja, misalnya 'build-and-deploy'
  build-and-deploy:
    # Menentukan jenis mesin virtual yang akan digunakan
    runs-on: ubuntu-latest

    # Langkah-langkah (steps) yang akan dieksekusi secara berurutan
    steps:
      # Langkah 1: Mengunduh kode dari repositori Anda ke mesin virtual
      - name: Checkout brench 📥
        uses: actions/checkout@v4 # Menggunakan Action siap pakai dari marketplace

      # Langkah 2: Menginstal Node.js, dependencies, dan build project
      - name: Install, Build, and Prepare 🔧
        run: |
          npm install
          npm run build
        # Di sinilah keajaibannya terjadi!
        env:
          # Membuat environment variable REACT_APP_BACKEND_URL
          # Nilainya diambil dari secret yang Anda buat di Pengaturan GitHub
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          
      # Langkah 3: Melakukan deploy ke branch gh-pages
      - name: Deploy 🚀
        uses: Cyber/github-pages-deploy-action@v4.6.3
        with:
          branch: gh-pages # Branch tujuan untuk deploy
          folder: build   # Folder yang akan di-deploy (hasil dari 'npm run build')